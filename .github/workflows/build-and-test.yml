name: Build and test

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and run all tests
        run: |
          npm ci
          npx cypress install
          npm run build
          npm run test:unit:coverage
          npm run test:e2e
        env:
          CI: true
          CI_REPO_NAME: ${{ github.event.repository.name }}
          CI_REPO_OWNER: ${{ github.event.organization.login }}
          CI_COMMIT_SHA: ${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
          CI_BRANCH: ${{ github.head_ref }}
          FORCE_COLOR: 2
          HUSKY_SKIP_INSTALL: true
      ## 
      ## Disabling for now. There does not appear to be a secure way to do this
      ## with protected branches. See discussion:
      ## https://github.community/t/how-to-push-to-protected-branches-in-a-github-action/16101
      ##
      # - name: Commit built files
      #   run: |
      #     git config --local user.email "action@github.com"
      #     git config --local user.name "GitHub Action"
      #     git commit -m "Update build files 🏗" -a || echo "No changes to commit" && exit 0
      # - name: Push changes
      #   uses: ad-m/github-push-action@master
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage to Codecov
        # Branch/SHA are passed via env, never interpolated into the shell.
        # `github.head_ref` is attacker-controlled (a PR branch name may contain
        # `;`, `$()`, backticks) so `${{ }}` inside `run:` is a command-injection sink.
        run: >-
          bash <(curl -s https://codecov.io/bash)
          -f ./coverage/lcov.info
          -B "$HEAD_REF"
          -C "$COMMIT_SHA"
          -Z || echo 'Codecov upload failed'
        env:
          CI: true
          GITLAB_CI: true # pretend we are GitLab CI, while Codecov adding support for Github Actions
          CODECOV_ENV: github-action
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.sha }}
