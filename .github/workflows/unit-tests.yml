name: Unit tests

on:
  pull_request:
    paths:
      - 'src/scripts/**'
      - package-lock.json
      - '.browserslistrc'

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v2
        with:
          node-version: 12

      - name: Install dependencies
        run: npm install --no-optional --no-audit --ignore-scripts
        env:
          CYPRESS_INSTALL_BINARY: 0
          HUSKY_SKIP_INSTALL: true

      - run: npm run test:unit:coverage
        env:
          FORCE_COLOR: 2

      - name: Upload coverage to Codecov
        # Branch/SHA are passed via env, never interpolated into the shell.
        # `github.head_ref` is attacker-controlled (a PR branch name may contain
        # `;`, `$()`, backticks) so `${{ }}` inside `run:` is a command-injection sink.
        run: >-
          bash <(curl -s https://codecov.io/bash)
          -f ./coverage/lcov.info
          -B "$HEAD_REF"
          -C "$COMMIT_SHA"
          -Z || echo 'Codecov upload failed'
        env:
          CI: true
          GITLAB_CI: true # pretend we are GitLab CI, while Codecov adding support for Github Actions
          CODECOV_ENV: github-action
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
          HEAD_REF: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.sha }}
